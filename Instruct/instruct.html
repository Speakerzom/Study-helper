    52%  { transform:scale(1.45); color:#7FFF00; text-shadow:0 0 18px #7FFF00; letter-spacing:.04em; }
    68%  { transform:scale(1.65); color:#00CED1; text-shadow:0 0 22px #00CED1; letter-spacing:.05em; }
    84%  { transform:scale(1.3);  color:#FFD700; text-shadow:0 0 14px #FFD700; letter-spacing:.03em; }
    100% { transform:scale(1);    color:#FF6B00; text-shadow:1px 1px 0 rgba(0,0,0,.8); letter-spacing:.02em; }
